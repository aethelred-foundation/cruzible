[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cruzible-sdk"
version = "0.1.0"
description = "Phase-1 Python utilities for Cruzible canonical payloads"
requires-python = ">=3.10"
dependencies = [
  "pycryptodome==4.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
